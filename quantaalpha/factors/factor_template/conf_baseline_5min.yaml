# =============================================================================
# QuantaAlpha 分钟级（5min）回测配置
#
# 数据源：quant_datahub 从 QMT 采集并落库后导出的 Qlib 数据集
#   D:/qqmt/qlib_data/cn_5m_full
#   日历 2026-01-05 09:35 ~ 2026-09-30 15:00（8688 根 5 分钟 K 线）
#
# 与日频 conf_baseline.yaml 的差异（关键）：
#   1. data_loader 增加 freq: 5min —— QlibDataLoader 的构造参数，
#      否则它默认按 day 去读 calendars/day.txt，在分钟数据集上会取不到数据。
#   2. qlib_init.freq: 5min —— 供 BacktestRunner 解析频率（runner 原先硬编码
#      freq='day'，已改为从配置读取）。
#   3. ann_scaler 改为 252 * 48 = 12096（每年 252 个交易日 × 48 根 5 分钟 K 线）。
#      注意：这个年化口径会把分钟级 IC 放大约 sqrt(48)≈6.9 倍，
#      且未扣交易成本，只用于同一口径内的横向比较，不要当真实年化收益看。
#   4. 标的池默认 liquid500（按近 90 天平均成交额取 Top500），
#      全市场 5364 只 × 8688 根 = 4600 万行，LightGBM + 回测内存/耗时不可控。
#      生成命令：python -m datahub liquid-instruments --out D:/qqmt/qlib_data/cn_5m_full --top 500
#
# 诚实边界：
#   - benchmark 用 SH600000 占位：本数据集中指数（SH000300 等）的 5 分钟数据
#     只有 2026-08-19 之后这一段，覆盖不了完整回测区间。IC/ICIR/年化/回撤
#     不受影响，只有「相对基准超额」这一项失真。
#   - $factor 恒为 1.0：入库的是不复权价（QMT dividend_type="none"），
#     与旧项目 research provider 的 factor_policy=constant_1 口径一致。
# =============================================================================

qlib_init:
    provider_uri: "D:/qqmt/qlib_data/cn_5m_full"
    region: cn
    freq: 5min

market: &market liquid500
benchmark: &benchmark SH600000

data_handler_config: &data_handler_config
    start_time: 2026-01-05
    end_time: 2026-09-30
    instruments: *market
    data_loader:
        class: qlib.contrib.data.loader.QlibDataLoader
        kwargs:
            freq: 5min
            config:
                feature:
                    - ["($close-$open)/$open", "$volume/Mean($volume, 20)", "($high-$low)/Ref($close, 1)", "$close/Ref($close, 1)-1"]
                    - ["OPEN_RET", "VOL_RATIO", "RANGE_RET", "CLOSE_RET"]
                label:
                    # 下一根 5 分钟 K 线的收益。噪声较大，可按需拉长周期：
                    #   1 小时(12 根):  Ref($close, -13)/Ref($close, -1) - 1
                    #   次日同刻(48根): Ref($close, -49)/Ref($close, -1) - 1
                    - ["Ref($close, -2)/Ref($close, -1) - 1"]
                    - ["LABEL0"]

    learn_processors:
        - class: Fillna
          kwargs:
              fields_group: feature
        - class: DropnaLabel
        - class: CSRankNorm
          kwargs:
              fields_group: feature
        - class: CSRankNorm
          kwargs:
              fields_group: label

    infer_processors:
        - class: Fillna
          kwargs:
              fields_group: feature
        - class: CSRankNorm
          kwargs:
              fields_group: feature
        - class: CSRankNorm
          kwargs:
              fields_group: label

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 30
            n_drop: 3
    backtest:
        start_time: 2026-08-01
        end_time: 2026-09-30
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            codes: *market
            limit_threshold: 0.095
            deal_price: open
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.05
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
            early_stopping_round: 50
            num_boost_round: 300

    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: DataHandlerLP
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2026-01-05, 2026-05-31]
                valid: [2026-06-01, 2026-07-31]
                test: [2026-08-01, 2026-09-30]

    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              model: <MODEL>
              dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              ana_long_short: False
              ann_scaler: 12096
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              config: *port_analysis_config
