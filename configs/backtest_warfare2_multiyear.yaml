######################################################################
# 战法2 (均线回踩低吸) 多周期回测配置 —— 方向②
# 数据集：cn_real_full（2020-01-02 ~ 2026-08-18，全 A ~5210 只，1599 天）
# 说明：
#   - 本机仍无 SH000300 / csi300 指数特征，benchmark 用 SH600000 占位（单只股票，非市场指数）。
#   - llm.enabled=false → 确定性、不依赖网络。
#   - 多周期验证：train 4yr / valid 1yr / test ~1.6yr，替代 2025 单年 sanity-check。
#   - end_time=2026-08-17（避开日历末日 2026-08-18，防 Qlib 越界 bug）。
######################################################################

random_seed: 42

experiment:
  name: "backtest_warfare2_multiyear"
  recorder: "backtest_warfare2_multiyear_recorder"
  output_dir: "data/results/backtest_warfare2_multiyear"
  output_metrics_file: "backtest_metrics.json"

factor_source:
  type: "custom"
  custom:
    json_files: []
    quality_filter: null
    max_factors: null
    use_llm_for_incompatible: false

  combined:
    official_source: "alpha158_20"
    include_custom: true

data:
  provider_uri: "~/.qlib/qlib_data/cn_real_full"
  region: "cn"
  market: "all"
  start_time: "2020-01-02"
  end_time: "2026-08-17"

dataset:
  label: "Ref($close, -2) / Ref($close, -1) - 1"

  learn_processors:
    - class: "Fillna"
      kwargs:
        fields_group: "feature"
    - class: "ProcessInf"
    - class: "DropnaLabel"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "feature"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "label"

  infer_processors:
    - class: "Fillna"
      kwargs:
        fields_group: "feature"
    - class: "ProcessInf"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "feature"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "label"

  segments:
    train: ["2020-01-02", "2023-12-29"]
    valid: ["2024-01-02", "2024-12-31"]
    test:  ["2025-01-02", "2026-08-17"]

model:
  type: "lgb"
  params:
    loss: "mse"
    learning_rate: 0.1
    max_depth: 8
    num_leaves: 210
    colsample_bytree: 0.8879
    subsample: 0.8789
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    num_threads: 20
    seed: 42
    random_state: 42
    early_stopping_round: 50
    num_boost_round: 500
    min_child_samples: 100
    feature_fraction_bynode: 0.8

backtest:
  strategy:
    class: "TopkDropoutStrategy"
    module_path: "qlib.contrib.strategy"
    kwargs:
      signal: "<PRED>"
      topk: 50
      n_drop: 5

  backtest:
    start_time: "2025-01-02"
    end_time: "2026-08-17"
    account: 100000000
    benchmark: "SH600000"
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: "open"
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5

llm:
  enabled: false
  timeout: 300
  max_retries: 3
  cache_results: true
  cache_dir: "data/results/factor_cache"
  auto_extract_cache: false
  debug: false

factor_calculation:
  output_dir: "data/results/computed_factors_multiyear"
  save_intermediate: true
  n_jobs: 4
  data_file: null
