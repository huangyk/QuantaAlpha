######################################################################
# 战法2 (均线回踩低吸) 专用回测配置
# 注意：本机 Qlib cn_data 仅有 2025-01-27 ~ 2025-12-31 数据，
#       且无 csi300 / SH000300 指数，故 universe=all, benchmark 用 SH600000 占位。
#       这是 1 年样本的 sanity-check，非 2016-2025 全周期验证。
######################################################################

random_seed: 42

experiment:
  name: "backtest_warfare2"
  recorder: "backtest_warfare2_recorder"
  output_dir: "data/results/backtest_warfare2"
  output_metrics_file: "backtest_metrics.json"

factor_source:
  type: "custom"
  custom:
    json_files: []
    quality_filter: null
    max_factors: null
    use_llm_for_incompatible: true

  combined:
    official_source: "alpha158_20"
    include_custom: true

data:
  provider_uri: "~/.qlib/qlib_data/cn_data"
  region: "cn"
  market: "all"
  start_time: "2025-01-27"
  end_time: "2025-12-31"

dataset:
  label: "Ref($close, -2) / Ref($close, -1) - 1"

  learn_processors:
    - class: "Fillna"
      kwargs:
        fields_group: "feature"
    - class: "ProcessInf"
    - class: "DropnaLabel"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "feature"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "label"

  infer_processors:
    - class: "Fillna"
      kwargs:
        fields_group: "feature"
    - class: "ProcessInf"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "feature"
    - class: "CSRankNorm"
      kwargs:
        fields_group: "label"

  segments:
    train: ["2025-01-27", "2025-07-31"]
    valid: ["2025-08-01", "2025-09-30"]
    test:  ["2025-10-01", "2025-12-26"]

model:
  type: "lgb"
  params:
    loss: "mse"
    learning_rate: 0.1
    max_depth: 8
    num_leaves: 210
    colsample_bytree: 0.8879
    subsample: 0.8789
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    num_threads: 20
    seed: 42
    random_state: 42
    early_stopping_round: 50
    num_boost_round: 500
    min_child_samples: 100
    feature_fraction_bynode: 0.8

backtest:
  strategy:
    class: "TopkDropoutStrategy"
    module_path: "qlib.contrib.strategy"
    kwargs:
      signal: "<PRED>"
      topk: 50
      n_drop: 5

  backtest:
    start_time: "2025-10-01"
    end_time: "2025-12-26"
    account: 100000000
    benchmark: "SH600000"
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: "open"
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5

llm:
  enabled: true
  timeout: 300
  max_retries: 3
  cache_results: true
  cache_dir: "data/results/factor_cache"
  auto_extract_cache: false
  debug: false

factor_calculation:
  output_dir: "data/results/computed_factors"
  save_intermediate: true
  n_jobs: 4
  data_file: null
